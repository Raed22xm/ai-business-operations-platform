services:
  db:
    image: postgres:16-alpine
    container_name: aibusiness-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aibusiness
      POSTGRES_USER: aibusiness_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aibusiness_secure_pass_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibusiness_user -d aibusiness"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aibusiness-backend
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=aibusiness;Username=aibusiness_user;Password=${DB_PASSWORD:-aibusiness_secure_pass_123}
      Auth__Username: ${AUTH_USERNAME:-admin}
      Auth__Password: ${AUTH_PASSWORD:-admin123}
      Auth__JwtSigningKey: ${JWT_SIGNING_KEY:-dev-super-secret-jwt-signing-key-minimum-64-characters-long-operations-hub-platform}
      Auth__JwtIssuer: AiBusiness.Api
      Auth__JwtAudience: AiBusiness.Frontend
      ApplyMigrationsOnStartup: "true"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5222
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "${BACKEND_PORT:-5280}:5222"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aibusiness-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:5222
      NODE_ENV: production
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3080}:3000"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: aibusiness-tunnel
    restart: unless-stopped
    command: tunnel --url http://frontend:3000
    depends_on:
      - frontend

volumes:
  postgres_data:
